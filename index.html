<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>单词消消乐</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
  <h1>单词消消乐</h1>
  <div class="difficulty">
    <label for="difficultySelect">学习难度</label>
    <select id="difficultySelect">
      <option value="all" selected>全部</option>
      <option value="lower">低年级</option>
      <option value="upper">高年级</option>
      <option value="middle">初中</option>
    </select>
  </div>
</header>
<button id="soundBtn" aria-label="音效开关">音效 开</button>
<div class="status">
  <span id="roundLabel">全部词库 · 第 1 关</span>
  <span id="timer">用时 00:00</span>
</div>
<div class="board" id="board"></div>
<div class="overlay hidden" id="overlay">
  <div class="card">
    <h2>恭喜你挑战成功！</h2>
    <p id="finalTime">用时 00:00</p>
    <button id="nextBtn">继续挑战</button>
  </div>
</div>
<script src="js/data/words.js"></script>
<script src="js/match-core.js"></script>
<script src="js/audio.js"></script>
<script src="js/speech.js"></script>
<script src="js/match-game.js"></script>
</body>
</html>

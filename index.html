<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>单词消消乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #FFF6C9;
    background-image: radial-gradient(rgba(255, 210, 110, .35) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px 12px 34px;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  header { text-align: center; }
  h1 {
    font-size: clamp(42px, 7vw, 76px);
    font-weight: 900;
    letter-spacing: 10px;
    color: #B45309;
    text-shadow: 0 3px 0 #fff, 0 8px 18px rgba(180, 83, 9, .35);
  }
  .difficulty {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 12px;
    padding: 8px 12px 8px 16px;
    border: 2px solid rgba(180, 83, 9, .2);
    border-radius: 999px;
    color: #7C4A03;
    background: rgba(255, 255, 255, .58);
    box-shadow: 0 5px 14px rgba(180, 83, 9, .12);
    font-size: clamp(15px, 1.8vw, 19px);
    font-weight: 800;
  }
  .difficulty select {
    border: 2px solid #F7B32B;
    border-radius: 999px;
    padding: 7px 34px 7px 14px;
    color: #7C4A03;
    background: #FFFDF2;
    font: inherit;
    cursor: pointer;
    outline: none;
  }
  .difficulty select:focus-visible { box-shadow: 0 0 0 4px rgba(247, 179, 43, .32); }
  .status {
    display: flex; justify-content: space-between; align-items: center;
    width: min(94vw, 1150px);
    font-size: clamp(15px, 1.8vw, 20px);
    font-weight: 700; color: #7C4A03;
    margin: 10px 0 16px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(10px, 1.8vw, 24px);
    width: min(94vw, 1150px);
  }
  .bubble {
    position: relative;
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: clamp(6px, 1vw, 14px);
    cursor: pointer;
    font-weight: 900;
    font-size: clamp(16px, 2.7vw, 32px);
    line-height: 1.25;
    word-break: break-word;
    transition: transform .18s ease, box-shadow .18s ease;
    touch-action: manipulation;
    overflow: hidden;
  }
  .bubble::before {
    content: ""; position: absolute; top: 8%; left: 13%;
    width: 26%; height: 16%; border-radius: 50%;
    background: rgba(255, 255, 255, .85);
    filter: blur(2px); pointer-events: none;
  }
  .bubble.long { font-size: clamp(12px, 2vw, 24px); }
  .bubble.selected {
    transform: scale(1.08);
    outline: 5px solid #fff; outline-offset: 4px;
    box-shadow: 0 0 0 4px rgba(255, 215, 0, .55), 0 0 36px rgba(255, 200, 0, .8), 0 12px 26px rgba(0, 0, 0, .25) !important;
    z-index: 2;
  }
  .bubble.wrong { animation: shake .45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); } 40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
  }
  .bubble.gone { animation: pop .5s forwards; pointer-events: none; }
  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0) rotate(90deg); opacity: 0; }
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .55);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .card {
    background: #fff;
    border-radius: 28px;
    padding: clamp(30px, 4vw, 54px) clamp(34px, 5vw, 70px);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    animation: rise .4s ease;
  }
  @keyframes rise { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h2 {
    font-size: clamp(30px, 4.5vw, 50px);
    color: #B45309; margin-bottom: 16px; letter-spacing: 3px;
  }
  .card p {
    font-size: clamp(20px, 3vw, 32px); color: #555;
    margin-bottom: 28px; font-weight: 700;
  }
  #nextBtn {
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 900; letter-spacing: 6px;
    padding: 15px 56px;
    border: none; border-radius: 999px;
    color: #fff;
    background: linear-gradient(180deg, #FFB347, #E07B00);
    box-shadow: 0 8px 20px rgba(224, 123, 0, .45), inset 0 2px 4px rgba(255, 255, 255, .5);
    cursor: pointer;
    touch-action: manipulation;
  }
  #nextBtn:active { transform: translateY(2px); }
  #soundBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 20;
    display: flex; align-items: center;
    padding: 10px 20px;
    border: 2px solid #F5B940;
    border-radius: 999px;
    background: linear-gradient(180deg, #FFF3C4, #FFE29A);
    color: #B45309;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    box-shadow: 0 4px 12px rgba(224, 123, 0, .25), inset 0 2px 4px rgba(255, 255, 255, .6);
    cursor: pointer;
    touch-action: manipulation;
  }
  #soundBtn:active { transform: translateY(2px); }
  #soundBtn.off {
    background: linear-gradient(180deg, #F3E8C9, #E9DCAE);
    color: #9A7B4F;
    border-color: #D9C48A;
    opacity: .85;
  }

<body>
<header>
  <h1>单词消消乐</h1>
  <div class="difficulty">
    <label for="difficultySelect">学习难度</label>
    <select id="difficultySelect">
      <option value="all" selected>全部</option>

  ['summer', '夏天'], ['autumn', '秋天'], ['winter', '冬天'],
  ['head', '头'], ['eye', '眼睛'], ['ear', '耳朵'], ['nose', '鼻子'], ['mouth', '嘴巴'],
  ['hand', '手'], ['foot', '脚'], ['leg', '腿'], ['arm', '手臂'], ['hair', '头发'],
  ['face', '脸'], ['tooth', '牙齿'],
  ['shirt', '衬衫'], ['dress', '连衣裙'], ['skirt', '裙子'], ['coat', '外套'], ['hat', '帽子'],
  ['cap', '鸭舌帽'], ['shoe', '鞋子'], ['sock', '袜子'], ['trousers', '裤子'], ['glove', '手套'],
  ['scarf', '围巾'], ['sweater', '毛衣'],
  ['football', '足球'], ['basketball', '篮球'], ['volleyball', '排球'], ['tennis', '网球'],

const wordLevels = new Map();
let gradedWordCount = 0;
Object.entries(GRADE_WORDS).forEach(([level, words]) => {
  words.forEach(word => {
    if (wordLevels.has(word)) throw new Error('单词重复分级：' + word);
    wordLevels.set(word, level);
    gradedWordCount++;
  });
});

const WORDS = BASE_WORDS.map(([english, chinese]) => [english, chinese, wordLevels.get(english)]);
if (gradedWordCount !== BASE_WORDS.length || WORDS.some(word => !word[2])) {
  throw new Error('词库分级不完整，请检查 GRADE_WORDS');
}

const board = document.getElementById('board');
const overlay = document.getElementById('overlay');
const finalTimeEl = document.getElementById('finalTime');
const timerEl = document.getElementById('timer');
const roundLabel = document.getElementById('roundLabel');
const nextBtn = document.getElementById('nextBtn');
const difficultySelect = document.getElementById('difficultySelect');
const soundBtn = document.getElementById('soundBtn');

let usedIdx = new Set();
let activeLevel = 'all';
let round = 0;
let pairs = [];
let selected = null;
let matched = 0;
let startAt = 0;
let timerId = null;
let audioCtx = null;
let soundOn = true;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickPairs() {
  const pool = WORDS.map((word, index) => ({ word, index }))
    .filter(item => activeLevel === 'all' || item.word[2] === activeLevel);
  let avail = pool.filter(item => !usedIdx.has(item.index));
  if (avail.length < 9) { usedIdx = new Set(); avail = pool; }
  shuffle(avail);
  const chosen = avail.slice(0, 9);
  chosen.forEach(item => usedIdx.add(item.index));
  return chosen.map(item => item.word);
}

function luminance(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

function shade(hex, f) {
  const c = hex.replace('#', '');
  const r = Math.round(parseInt(c.substr(0, 2), 16) * f);
  const g = Math.round(parseInt(c.substr(2, 2), 16) * f);
  const b = Math.round(parseInt(c.substr(4, 2), 16) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function buildBoard(list) {
  pairs = list;
  matched = 0;
  selected = null;
  board.innerHTML = '';
  const tiles = [];
  list.forEach((w, i) => {
    tiles.push({ key: i, type: 'en', text: w[0] });
    tiles.push({ key: i, type: 'zh', text: w[1] });
  });
  shuffle(tiles);
  tiles.forEach(t => {
    const el = document.createElement('div');
    el.className = 'bubble' + (t.text.length > 7 ? ' long' : '');
    el.textContent = t.text;
    el.dataset.key = t.key;
    el.dataset.type = t.type;
    el.dataset.text = t.text;
    el.dataset.level = list[t.key][2];
    const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    el.style.background = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), ' + color + ' 58%, ' + shade(color, 0.45) + ' 100%)';
    el.style.boxShadow = 'inset -8px -12px 18px rgba(0,0,0,.18), inset 6px 10px 14px rgba(255,255,255,.4), 0 10px 22px rgba(0,0,0,.22)';
    el.style.color = luminance(color) > 0.55 ? '#333' : '#fff';
    el.style.textShadow = luminance(color) > 0.55 ? '0 1px 2px rgba(255,255,255,.6)' : '0 1px 3px rgba(0,0,0,.45)';
    board.appendChild(el);
  });
}

let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(word) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.95;
  u.pitch = 1.05;
  const v = voices.find(v => v.lang.replace('_', '-').toLowerCase().startsWith('en'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, dur, type, vol, when) {
  const ctx = getCtx();
  const t = ctx.currentTime + when;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}

function playSuccess() {
  if (!soundOn) return;
  tone(523.25, 0.4, 'triangle', 0.3, 0);
  tone(659.25, 0.4, 'triangle', 0.3, 0.12);
  tone(783.99, 0.5, 'triangle', 0.3, 0.24);
}

function playFail() {
  if (!soundOn) return;
  const ctx = getCtx();
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(200, t);
  o.frequency.exponentialRampToValueAtTime(110, t + 0.45);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.18, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(g).connect(ctx.destination);
  o.start(t);
  o.stop(t + 0.55);
}

function playWin() {
  if (!soundOn) return;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.5, 'triangle', 0.3, i * 0.15));
}

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function setSound(on) {
  soundOn = on;
  soundBtn.textContent = on ? '音效 开' : '音效 关';
  soundBtn.classList.toggle('off', !on);
}

function startTimer() {
  startAt = Date.now();
  clearInterval(timerId);
  timerId = setInterval(function () {
    timerEl.textContent = '用时 ' + fmt(Date.now() - startAt);
  }, 250);
}

function stopTimer() { clearInterval(timerId); }

function showWin() {
  stopTimer();
  finalTimeEl.textContent = '本次用时：' + fmt(Date.now() - startAt);
  overlay.classList.remove('hidden');
  playWin();
}

board.addEventListener('click', function (e) {
  const el = e.target.closest('.bubble');
  if (!el || el.classList.contains('gone')) return;
  if (!startAt) startTimer();
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    selected = null;
    return;
  }
  if (el.dataset.type === 'en') speak(el.dataset.text);
  if (!selected) {
    selected = el;
    el.classList.add('selected');
    return;
  }
  const a = selected, b = el;
  selected = null;
  if (a.dataset.key === b.dataset.key && a.dataset.type !== b.dataset.type) {
    playSuccess();
    a.classList.remove('selected');
    a.classList.add('gone');
    b.classList.add('gone');
    matched++;
    if (matched === pairs.length) showWin();
  } else {
    playFail();
    a.classList.add('wrong');
    b.classList.add('wrong');
    setTimeout(function () {
      a.classList.remove('selected', 'wrong');
      b.classList.remove('wrong');
    }, 480);
  }
});

nextBtn.addEventListener('click', function () {
  overlay.classList.add('hidden');
  round++;
  roundLabel.textContent = GRADE_LABELS[activeLevel] + ' · 第 ' + (round + 1) + ' 关';
  startAt = 0;
  timerEl.textContent = '用时 00:00';
  buildBoard(pickPairs());
});

difficultySelect.addEventListener('change', function () {
  activeLevel = difficultySelect.value;
  usedIdx = new Set();
  round = 0;
  startAt = 0;
  stopTimer();
  timerEl.textContent = '用时 00:00';
  roundLabel.textContent = GRADE_LABELS[activeLevel] + ' · 第 1 关';
  overlay.classList.add('hidden');
  buildBoard(pickPairs());
});

soundBtn.addEventListener('click', function () {
  setSound(!soundOn);
});

buildBoard(pickPairs());
</script>
</body>
</html>
